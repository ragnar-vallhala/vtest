# Coverage of vtest.c, merged from the unit tests (which include it) and the
# real binary (which e2e_test.py drives). `cmake --build <dir> --target
# coverage` runs this; the gates are the floor CI holds the line to.
filter = vtest.c
# The test TUs rename main() to vtest_main(): without this, their uncalled
# copy of main's lines masks the binary's hits on the same lines.
merge-lines = yes
exclude-unreachable-branches = yes
fail-under-line = 99
fail-under-branch = 98
print-summary = yes
