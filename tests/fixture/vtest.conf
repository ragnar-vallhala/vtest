# The fixture repo e2e_test.py runs vtest in. One suite per adapter and
# per way a suite can be broken.
[ct]
adapter   = ctest
dir       = build
configure = cmake -S . -B build
open      = 1

[py]
adapter = pytest
filter  = py
open    = 1

[gate]
adapter = check
cmd     = echo gate ran

[hil]
adapter = check
cmd     = exit 77

[nocmd]
adapter = check

[unbuilt]
adapter = ctest
dir     = missing_build
