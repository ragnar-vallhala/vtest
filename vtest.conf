# vtest, run against itself. See README.md for the format.

[unit]
adapter = ctest
dir     = build
prefix  =
configure = cmake -S . -B build
open    = 1

# The same cases under ASan + UBSan, from a build dir vtest configures itself.
[unit-asan]
adapter = ctest
dir     = build_san
prefix  =
configure = cmake -S . -B build_san -DVTEST_SANITIZE=ON

[loc]
adapter = check
cmd     = ./loc.sh
